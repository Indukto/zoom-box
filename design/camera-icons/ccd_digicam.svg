<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <title>CCD Digicam — Y2K Metallic Pocket Digital Camera</title>
  <!-- Main Brushed Aluminum Slate-Blue Body -->
  <rect x="6" y="14" width="36" height="26" rx="3.5" fill="#475569" stroke="#94A3B8" stroke-width="1.5"/>
  <!-- Two-Tone Y2K Brushed Metallic Left Plate -->
  <path d="M 6 14 L 28 14 C 29.5 14 30.5 15.5 30.5 17 L 30.5 40 L 6 40 Z" fill="#5A7D8C" opacity="0.9"/>
  <!-- Ergonomic Curved Grip Ridge on Right -->
  <rect x="38" y="18" width="2" height="18" rx="1" fill="#CBD5E1"/>
  <!-- Top Zoom Ring & Shutter Button -->
  <rect x="30" y="11" width="7" height="3" rx="1.5" fill="#E2E8F0" stroke="#64748B" stroke-width="0.8"/>
  <circle cx="25" cy="12.5" r="1.2" fill="#38BDF8"/>
  <!-- Tiny Glass Optical Viewfinder Window -->
  <rect x="18" y="16" width="3.5" height="2.5" rx="0.5" fill="#0F172A" stroke="#CBD5E1" stroke-width="0.6"/>
  <rect x="18.5" y="16.5" width="1.5" height="1" rx="0.2" fill="#7DD3FC"/>
  <!-- Horizontal Xenon Flash Window with Fresnel Diffuser -->
  <rect x="23" y="15.8" width="6.5" height="3" rx="0.6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.6"/>
  <line x1="25" y1="16" x2="25" y2="18.5" stroke="#CBD5E1" stroke-width="0.5"/>
  <line x1="27" y1="16" x2="27" y2="18.5" stroke="#CBD5E1" stroke-width="0.5"/>
  <!-- Green Power / Ready Status LED -->
  <circle cx="15" cy="17.2" r="0.9" fill="#22C55E"/>
  <!-- Telescoping Optical Zoom Lens Barrel (Extending Out) -->
  <!-- 1. Outer Base Collar -->
  <circle cx="18" cy="28" r="9" fill="#334155" stroke="#CBD5E1" stroke-width="1.3"/>
  <!-- 2. Telescoping Inner Barrel -->
  <circle cx="18" cy="28" r="6.8" fill="#1E293B" stroke="#94A3B8" stroke-width="0.8"/>
  <!-- 3. Automatic Sliding Shutter Leaves -->
  <circle cx="18" cy="28" r="4.8" fill="#0F172A"/>
  <!-- CCD Lens Cold Blue/Cyan Flare Glare -->
  <path d="M 15 25.5 A 3.2 3.2 0 0 1 20.5 25" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="16" cy="27" r="0.8" fill="#FFFFFF"/>
</svg>
