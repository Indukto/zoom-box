<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <title>Cross Process — Lomo LC-A Experimental Cross-Process Camera</title>
  <!-- Main Compact Camera Body (Matte Black with Crimson Trim) -->
  <rect x="6" y="14" width="36" height="26" rx="4" fill="#18181B" stroke="#C04040" stroke-width="1.5"/>
  
  <!-- Inset Horizontal Crimson Faceplate Band -->
  <rect x="6" y="20" width="36" height="13" fill="#241B1C"/>
  <line x1="6" y1="20" x2="42" y2="20" stroke="#C04040" stroke-width="0.8"/>
  <line x1="6" y1="33" x2="42" y2="33" stroke="#C04040" stroke-width="0.8"/>

  <!-- Top Controls: Knurled Winding Wheel (Left) & Red Shutter Button (Right) -->
  <rect x="10" y="11.5" width="6" height="2.8" rx="0.8" fill="#3F3F46" stroke="#71717A" stroke-width="0.6"/>
  <rect x="32" y="11" width="5" height="3.2" rx="1" fill="#EF4444" stroke="#B91C1C" stroke-width="0.8"/>

  <!-- Top Centered Optical Viewfinder -->
  <rect x="21.5" y="15" width="5" height="3.5" rx="0.8" fill="#0F172A" stroke="#E2E8F0" stroke-width="0.8"/>
  <rect x="22.5" y="15.8" width="2" height="1.5" rx="0.3" fill="#06B6D4" opacity="0.8"/>

  <!-- Iconic Lomo Red Badge (Front Left) -->
  <rect x="9.5" y="22.5" width="5" height="5" rx="1" fill="#DC2626" stroke="#EF4444" stroke-width="0.5"/>
  <circle cx="12" cy="25" r="1.2" fill="#FFFFFF"/>

  <!-- Zone Focus Selector Lever (Front Right) -->
  <rect x="33.5" y="24" width="2" height="5.5" rx="0.6" fill="#E2E8F0"/>
  <circle cx="34.5" cy="24" r="1" fill="#EF4444"/>

  <!-- Centered Cross-Process Lens Standard -->
  <circle cx="24" cy="27" r="9.5" fill="#18181B" stroke="#E2E8F0" stroke-width="1.4"/>
  
  <!-- The Famous Cross-Process Split Ring (Cyan vs Magenta) -->
  <!-- Left Half: Electric Neon Cyan -->
  <path d="M 24 19 A 8 8 0 0 0 24 35 L 24 32.5 A 5.5 5.5 0 0 1 24 21.5 Z" fill="#06B6D4"/>
  <!-- Right Half: Hot Magenta / Crimson -->
  <path d="M 24 19 A 8 8 0 0 1 24 35 L 24 32.5 A 5.5 5.5 0 0 0 24 21.5 Z" fill="#F43F5E"/>

  <!-- Inner Deep Lens Element with Aperture Blades -->
  <circle cx="24" cy="27" r="5" fill="#09090B" stroke="#374151" stroke-width="0.8"/>
  
  <!-- Cross-Processed Dual Glare Glints -->
  <path d="M 21.5 24.5 A 3 3 0 0 1 25.5 24" stroke="#06B6D4" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="25.5" cy="28.5" r="0.8" fill="#F43F5E"/>
  <circle cx="23.5" cy="26" r="0.6" fill="#FFFFFF"/>
</svg>
