<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <title>Custom / Fallback — Modular Film Craft Camera</title>
  <!-- Main Modular Body -->
  <rect x="6" y="14" width="36" height="26" rx="4" fill="#1C1917" stroke="#E4D5B7" stroke-width="1.3"/>
  <!-- Top Deck Bar -->
  <rect x="6" y="14" width="36" height="5" rx="1.5" fill="#292524" stroke="#A8A29E" stroke-width="0.8"/>
  <!-- Modular Top Accessory Shoe (Cold Shoe) -->
  <rect x="21" y="11" width="6" height="3" rx="0.8" fill="#E4D5B7" stroke="#A8A29E" stroke-width="0.8"/>
  <!-- Shutter Button (Right) & Craft Dial (Left) -->
  <rect x="32" y="11.5" width="4" height="2.5" rx="0.8" fill="#F5F5F4" stroke="#78716C" stroke-width="0.8"/>
  <rect x="11" y="12" width="4.5" height="2" rx="0.5" fill="#A8A29E"/>
  <!-- Circular Lens Mount with 4-Color Spectrum Ring (Palette / LUT Craft) -->
  <circle cx="24" cy="27" r="10.5" fill="#141210" stroke="#78716C" stroke-width="1"/>
  <!-- 4-Quadrant Color Spectrum Wheel Ring -->
  <!-- 1. Red (Top Right) -->
  <path d="M 24 18 A 9 9 0 0 1 33 27 L 30.5 27 A 6.5 6.5 0 0 0 24 20.5 Z" fill="#EF4444"/>
  <!-- 2. Yellow/Gold (Bottom Right) -->
  <path d="M 33 27 A 9 9 0 0 1 24 36 L 24 33.5 A 6.5 6.5 0 0 0 30.5 27 Z" fill="#F59E0B"/>
  <!-- 3. Emerald/Green (Bottom Left) -->
  <path d="M 24 36 A 9 9 0 0 1 15 27 L 17.5 27 A 6.5 6.5 0 0 0 24 33.5 Z" fill="#10B981"/>
  <!-- 4. Cobalt/Cyan (Top Left) -->
  <path d="M 15 27 A 9 9 0 0 1 24 18 L 24 20.5 A 6.5 6.5 0 0 0 17.5 27 Z" fill="#3B82F6"/>
  <!-- Inner Dark Glass Element -->
  <circle cx="24" cy="27" r="5" fill="#0A0908" stroke="#E4D5B7" stroke-width="0.6"/>
  <!-- Specular Lens Glare -->
  <path d="M 21.5 25 A 3 3 0 0 1 25.5 24.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="25" cy="28.5" r="0.7" fill="#FFFFFF"/>
</svg>
