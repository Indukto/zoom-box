<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <title>Instant Classic — Polaroid OneStep Instant Camera</title>
  <!-- Main Cream-White Housing -->
  <rect x="7" y="11" width="34" height="26" rx="4" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>
  <!-- Top Viewfinder Tower (Left) -->
  <rect x="9" y="7" width="8" height="5" rx="1.5" fill="#1F2937" stroke="#4B5563" stroke-width="0.8"/>
  <rect x="10.5" y="8" width="5" height="3" rx="0.8" fill="#38BDF8"/>
  <!-- Top Flash Bar Socket -->
  <rect x="20" y="8" width="18" height="3" rx="1" fill="#374151" stroke="#4B5563" stroke-width="0.8"/>
  <!-- Dark Lens Faceplate -->
  <rect x="14" y="16" width="20" height="18" rx="2.5" fill="#1F2937" stroke="#111827" stroke-width="1"/>
  <!-- The World-Famous Vertical Rainbow Stripe -->
  <rect x="21.5" y="26" width="1" height="8" fill="#EF4444"/>
  <rect x="22.5" y="26" width="1" height="8" fill="#F97316"/>
  <rect x="23.5" y="26" width="1" height="8" fill="#EAB308"/>
  <rect x="24.5" y="26" width="1" height="8" fill="#22C55E"/>
  <rect x="25.5" y="26" width="1" height="8" fill="#3B82F6"/>
  <!-- Big Circular Instant Lens -->
  <circle cx="24" cy="21.5" r="6" fill="#111827" stroke="#9CA3AF" stroke-width="1.2"/>
  <circle cx="24" cy="21.5" r="4.2" fill="#030712"/>
  <path d="M 21.8 19.5 A 3 3 0 0 1 25.5 19" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Big Red Shutter Button (Front Left) -->
  <circle cx="11" cy="25" r="3" fill="#DC2626" stroke="#991B1B" stroke-width="0.8"/>
  <circle cx="10.5" cy="24.2" r="1" fill="#EF4444"/>
  <!-- Exposure Compensation Wheel (Right) -->
  <circle cx="37" cy="25" r="2.5" fill="#4B5563" stroke="#374151" stroke-width="0.8"/>
  <path d="M 37 22.5 A 2.5 2.5 0 0 1 37 27.5 Z" fill="#E5E7EB"/>
  <!-- Bottom Film Exit Slot -->
  <rect x="11" y="36.5" width="26" height="2" rx="0.5" fill="#111827"/>
  <!-- Emerging Square White Instant Print -->
  <rect x="13.5" y="38" width="21" height="6.5" rx="1" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.8"/>
  <rect x="15.5" y="38" width="17" height="4.5" fill="#334155"/>
</svg>
