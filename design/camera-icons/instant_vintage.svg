<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <title>Instant Vintage — Classic Folding Bellows Peel-Apart Camera</title>
  <!-- Main Vintage Camera Body with Rich Plum Leatherette -->
  <rect x="6" y="14" width="36" height="26" rx="4" fill="#241B26" stroke="#8B5E8B" stroke-width="1.5"/>
  <rect x="8" y="16" width="32" height="22" rx="2.5" fill="#36223B"/>
  
  <!-- Accordion Folding Bellows Pleats (Left & Right of Lens Standard) -->
  <!-- Left Bellows Pleats -->
  <path d="M 8 19 L 14 21 L 8 24 L 14 26 L 8 29 L 14 31 L 8 34" stroke="#8B5E8B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <!-- Right Bellows Pleats -->
  <path d="M 40 19 L 34 21 L 40 24 L 34 26 L 40 29 L 34 31 L 40 34" stroke="#8B5E8B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- Top Dual-Window Rangefinder Housing (Zeiss Ikon Style) -->
  <rect x="14" y="8" width="20" height="7" rx="1.5" fill="#D1D5DB" stroke="#9CA3AF" stroke-width="1"/>
  <!-- Left Viewfinder Window -->
  <rect x="16" y="9.8" width="6.5" height="3.5" rx="0.6" fill="#0F172A" stroke="#64748B" stroke-width="0.6"/>
  <rect x="17" y="10.5" width="2.5" height="2" rx="0.3" fill="#38BDF8"/>
  <!-- Right Rangefinder Coincidence Window -->
  <rect x="25.5" y="9.8" width="6.5" height="3.5" rx="0.6" fill="#1E293B" stroke="#64748B" stroke-width="0.6"/>
  <rect x="26.5" y="10.5" width="2.5" height="2" rx="0.3" fill="#C084FC"/>

  <!-- Center Extended Front Lens Standard -->
  <rect x="14.5" y="17" width="19" height="19" rx="2" fill="#1C141E" stroke="#E2E8F0" stroke-width="1.2"/>
  
  <!-- Outer Chrome Lens Bezel -->
  <circle cx="24" cy="26.5" r="7.5" fill="#160F18" stroke="#CBD5E1" stroke-width="1.4"/>
  <!-- Aperture Selector Ring -->
  <circle cx="24" cy="26.5" r="5.5" fill="#2E1C33" stroke="#8B5E8B" stroke-width="0.8"/>
  <!-- Front Glass Element -->
  <circle cx="24" cy="26.5" r="4" fill="#0C070E"/>
  
  <!-- Vintage Plum/Violet Optical Coating Flare -->
  <path d="M 21.5 24.5 A 3 3 0 0 1 26 24" stroke="#C084FC" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="25.5" cy="28.5" r="0.8" fill="#FFFFFF"/>

  <!-- Shutter Cocking Lever (Top Right) & Red Release Button (Top Left) -->
  <circle cx="11.5" cy="21" r="1.5" fill="#DC2626" stroke="#991B1B" stroke-width="0.6"/>
  <line x1="34" y1="20" x2="37" y2="17.5" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Bottom Film Exit Slot -->
  <rect x="12" y="38" width="24" height="2" rx="0.5" fill="#111827"/>
  <!-- Emerging Vintage Instant Print (Warm Cream Border with Plum Tone Frame) -->
  <rect x="14.5" y="39.5" width="19" height="6" rx="0.8" fill="#FDFBF7" stroke="#E2E8F0" stroke-width="0.8"/>
  <rect x="16.5" y="39.5" width="15" height="4.5" fill="#583B5E"/>
</svg>
