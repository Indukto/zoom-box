<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <title>Street Mono 400 — Stealth Blacked-Out Street Rangefinder</title>
  <!-- Main Deep Obsidian Stealth Body -->
  <rect x="6" y="15" width="36" height="25" rx="4" fill="#121214" stroke="#52525B" stroke-width="1.3"/>
  <!-- Top Flat Stealth Deck -->
  <rect x="6" y="15" width="36" height="5" rx="2" fill="#27272A"/>
  <!-- Stealth Shutter Button -->
  <rect x="30" y="12.5" width="5" height="2.5" rx="0.8" fill="#3F3F46" stroke="#52525B" stroke-width="0.6"/>
  <!-- Stealth Control Dial -->
  <rect x="24" y="13.5" width="4" height="1.8" rx="0.5" fill="#18181B"/>
  <!-- Darkened Polarized Optical Viewfinder Window -->
  <rect x="9.5" y="16.5" width="5" height="3.5" rx="0.6" fill="#050505" stroke="#3F3F46" stroke-width="0.8"/>
  <rect x="10.5" y="17.2" width="2" height="1.5" rx="0.3" fill="#27272A"/>
  <!-- Tactile Diamond/Knurled Street Grip (Right Side) -->
  <rect x="34.5" y="18" width="6.5" height="19" rx="1.5" fill="#09090B" stroke="#27272A" stroke-width="0.8"/>
  <line x1="36" y1="21" x2="39.5" y2="21" stroke="#27272A" stroke-width="0.8"/>
  <line x1="36" y1="24" x2="39.5" y2="24" stroke="#27272A" stroke-width="0.8"/>
  <line x1="36" y1="27" x2="39.5" y2="27" stroke="#27272A" stroke-width="0.8"/>
  <line x1="36" y1="30" x2="39.5" y2="30" stroke="#27272A" stroke-width="0.8"/>
  <line x1="36" y1="33" x2="39.5" y2="33" stroke="#27272A" stroke-width="0.8"/>
  <!-- Discreet Wide-Angle 28mm Street Lens Barrel -->
  <circle cx="22" cy="27.5" r="9.5" fill="#09090B" stroke="#52525B" stroke-width="1.4"/>
  <!-- Street Ring Accent (Subtle dark asphalt ring) -->
  <circle cx="22" cy="27.5" r="7.8" fill="#18181B" stroke="#71717A" stroke-width="1"/>
  <!-- Deep-Set Front Glass Element -->
  <circle cx="22" cy="27.5" r="5.5" fill="#000000"/>
  <!-- Razor-Sharp High-Contrast Monochrome Street Reflection -->
  <path d="M 18.5 24.5 A 4 4 0 0 1 24.5 23.5" stroke="#E4E4E7" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="24.5" cy="29.5" r="0.8" fill="#A1A1AA"/>
</svg>
