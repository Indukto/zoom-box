<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <title>Sunlit Spill — 1990s Sliding Clamshell Compact Camera</title>
  <!-- Streamlined Capsule Body -->
  <rect x="5" y="14" width="38" height="25" rx="12.5" fill="#18181B" stroke="#F39C12" stroke-width="1.5"/>
  <!-- Exposed Inner Lens Chamber on Left -->
  <rect x="9" y="16.5" width="18" height="20" rx="3" fill="#09090B"/>
  <!-- Built-In Flash (Top Left) -->
  <circle cx="13.5" cy="20.5" r="2.5" fill="#FEF08A" stroke="#F59E0B" stroke-width="0.8"/>
  <circle cx="13.5" cy="20.5" r="1.2" fill="#FFFFFF"/>
  <!-- Dual AF Windows -->
  <circle cx="18.5" cy="19.5" r="1.1" fill="#DC2626"/>
  <circle cx="21.5" cy="19.5" r="1.1" fill="#1E293B"/>
  <!-- Exposed Golden Coated 35mm f/2.8 Prime Lens -->
  <circle cx="16.5" cy="28" r="6" fill="#18181B" stroke="#F59E0B" stroke-width="1.2"/>
  <circle cx="16.5" cy="28" r="4.2" fill="#451A03"/>
  <!-- Golden Sunburst Specular Lens Flare -->
  <path d="M 14 26 A 3 3 0 0 1 18.5 25.5" stroke="#FDE047" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="19" cy="26" r="1" fill="#FEF08A"/>
  <!-- The Famous Curved Sliding Clamshell Front Barrier (Slid Open to the Right) -->
  <path d="M 24 14.5 C 31 14.5 38 17.5 40.5 21.5 C 42.5 25 42.5 28.5 40.5 32 C 38 36 31 38.5 24 38.5 C 27.5 33 27.5 20 24 14.5 Z" fill="#D97706" stroke="#FBBF24" stroke-width="1.2"/>
  <!-- Grip Ridge on Slider -->
  <path d="M 33 21 C 34.5 24.5 34.5 28.5 33 32" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Top Ergonomic Shutter Pill Button -->
  <rect x="29" y="12" width="7" height="2.8" rx="1.4" fill="#E5E7EB" stroke="#71717A" stroke-width="0.8"/>
</svg>
