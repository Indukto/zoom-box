<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <title>Vivid Cool 400 — Japanese Titanium Luxury Compact</title>
  <!-- Main Titanium Chamfered Body -->
  <rect x="6" y="15" width="36" height="25" rx="3.5" fill="#1E293B" stroke="#2E9E8F" stroke-width="1.5"/>
  <!-- Front Titanium Faceplate Inset -->
  <rect x="7.5" y="16.5" width="33" height="22" rx="2" fill="#0F172A"/>
  <!-- Titanium Top Deck Bar -->
  <rect x="6" y="15" width="36" height="5" rx="1.5" fill="#334155" stroke="#2E9E8F" stroke-width="0.8"/>
  <!-- Top Controls: Manual Aperture Wheel (Right) & Shutter Button -->
  <rect x="34" y="12.5" width="4.5" height="2.5" rx="0.6" fill="#94A3B8" stroke="#475569" stroke-width="0.6"/>
  <rect x="27" y="12.5" width="5" height="2.5" rx="0.8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.8"/>
  <!-- Top Window Array: Viewfinder & Dual Infrared AF Windows -->
  <rect x="10" y="16" width="4.5" height="3" rx="0.6" fill="#0F172A" stroke="#2E9E8F" stroke-width="0.6"/>
  <rect x="10.8" y="16.6" width="2" height="1.5" rx="0.3" fill="#38BDF8"/>
  <!-- Dual AF Sensors -->
  <circle cx="17" cy="17.5" r="1.2" fill="#991B1B"/>
  <circle cx="20.5" cy="17.5" r="1.2" fill="#1E293B" stroke="#475569" stroke-width="0.5"/>
  <circle cx="24" cy="17.5" r="0.8" fill="#10B981"/>
  <!-- Carl Zeiss Sonnar Multi-Coated Lens Barrel -->
  <circle cx="23" cy="28" r="9.5" fill="#1E293B" stroke="#2E9E8F" stroke-width="1.5"/>
  <circle cx="23" cy="28" r="7.5" fill="#0F172A" stroke="#64748B" stroke-width="0.8"/>
  <!-- Multi-Coated Deep Glass Element -->
  <circle cx="23" cy="28" r="5.5" fill="#042F2E"/>
  <!-- Signature Cool Emerald/Teal Multi-Coating Glare -->
  <path d="M 19.5 25 A 4 4 0 0 1 25.5 24" stroke="#2DD4BF" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 20.5 31 A 3.5 3.5 0 0 0 25.5 30.5" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="20.5" cy="26" r="0.9" fill="#FFFFFF"/>
</svg>
